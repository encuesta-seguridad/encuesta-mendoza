<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=1.0, shrink-to-fit=yes">
  <title>Encuesta Victimológica y de Seguridad Ciudadana · Mendoza</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: #eef2f6; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 20px 12px 40px; color: #1e293b; }
    .survey-container { width: 100%; max-width: 600px; background: #ffffff; border-radius: 28px; box-shadow: 0 12px 30px rgba(0,0,0,0.08); overflow: hidden; }
    .survey-header { padding: 24px 24px 12px; text-align: center; border-bottom: 1px solid #e9edf2; }
    .survey-header h1 { font-size: 1.7rem; font-weight: 700; color: #0f3b5c; }
    .survey-header .subtitle { font-size: 0.9rem; color: #5e6f82; margin-top: 6px; font-weight: 500; }
    .progress-bar { height: 4px; background: #e2e8f0; width: 100%; }
    .progress-fill { height: 100%; background: #1e5a7b; width: 0%; transition: width 0.3s; }
    .step-container { padding: 24px 24px 32px; min-height: 360px; }
    .step { display: none; flex-direction: column; gap: 20px; animation: fadeSlide 0.3s ease; }
    .step.active { display: flex; }
    @keyframes fadeSlide { 0% { opacity: 0; transform: translateY(8px); } 100% { opacity: 1; transform: translateY(0); } }
    .step-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.6px; color: #64748b; font-weight: 600; margin-bottom: 4px; }
    .step-question { font-size: 1.2rem; font-weight: 600; color: #0f2b40; line-height: 1.4; margin-bottom: 8px; }
    .option-group { display: flex; flex-direction: column; gap: 12px; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .card-option { position: relative; }
    .card-option input { position: absolute; opacity: 0; pointer-events: none; }
    .card-option label { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 16px 8px; background: #f8fafd; border: 2px solid #e2e8f0; border-radius: 20px; text-align: center; font-weight: 500; color: #334155; cursor: pointer; transition: all 0.2s; min-height: 90px; font-size: 0.9rem; user-select: none; }
    .card-option input:checked+label { border-color: #1e5a7b; background: #e5f0f8; color: #0a3144; box-shadow: 0 4px 12px rgba(30,90,123,0.15); font-weight: 600; }
    .card-icon { font-size: 1.8rem; opacity: 0.8; }
    .slider-group { display: flex; flex-direction: column; gap: 8px; }
    .slider-labels { display: flex; justify-content: space-between; font-size: 0.85rem; color: #475569; font-weight: 500; }
    input[type="range"] { -webkit-appearance: none; width: 100%; height: 8px; background: #dce3eb; border-radius: 10px; outline: none; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; background: #1e5a7b; border-radius: 50%; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.2); border: 2px solid white; }
    .slider-value { text-align: center; font-weight: 700; color: #1e5a7b; font-size: 1rem; }
    .radio-row, .check-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 16px; cursor: pointer; transition: 0.15s; }
    .radio-row:hover, .check-row:hover { background: #edf2f7; }
    .radio-row input, .check-row input { width: 20px; height: 20px; accent-color: #1e5a7b; flex-shrink: 0; }
    .radio-row label, .check-row label { cursor: pointer; flex: 1; font-weight: 500; }
    .nav-buttons { display: flex; justify-content: space-between; margin-top: 24px; gap: 12px; }
    button { background: #1e5a7b; color: white; border: none; border-radius: 40px; padding: 14px 28px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: background 0.2s; flex: 1; min-width: 120px; }
    button.secondary { background: #eef2f6; color: #1e3b4f; border: 1px solid #d0d8e0; }
    button:hover { background: #134357; }
    button.secondary:hover { background: #dfe5ec; }
    button:active { transform: scale(0.97); }
    button:disabled { background: #b0c0cf; cursor: not-allowed; }
    .message { margin-top: 16px; padding: 12px 16px; border-radius: 18px; font-weight: 500; font-size: 0.9rem; }
    .message.success { background: #d9f2e6; color: #0b4635; }
    .message.error { background: #fee9e9; color: #991b1b; }
    textarea, input[type="text"], input[type="number"], select { border: 1px solid #d0d8e0; border-radius: 16px; padding: 12px 16px; font-size: 1rem; font-family: inherit; width: 100%; background: #fafbfc; }
    textarea:focus, input:focus, select:focus { border-color: #1e5a7b; outline: none; box-shadow: 0 0 0 3px rgba(30,90,123,0.1); }
    @media (max-width: 480px) { .step-question { font-size: 1.1rem; } .card-grid { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <div class="survey-container" id="surveyContainer">
    <div class="survey-header">
      <h1>Encuesta de Seguridad Ciudadana</h1>
      <div class="subtitle">Mendoza · Respuestas anónimas</div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <form id="mainForm" novalidate action="https://script.google.com/macros/s/AKfycbzFsn9IN84YjhZYrBxNbJ06e_fhXbBJJoH-l7-raN-xsuzJLiohXWmqbZ_P32c7jJoH/exec" method="POST" target="hidden_iframe">
      <div class="step-container" id="stepContainer"></div>
    </form>
    <iframe name="hidden_iframe" style="display:none;"></iframe>
  </div>

  <script>
    (function() {
      const steps = [
        { id: 'consent', html: `<div class="step-label">Confidencialidad</div><div class="step-question">¿Acepta participar voluntariamente en esta encuesta anónima?</div><div class="option-group"><div class="radio-row"><input type="radio" name="consentimiento" id="consent_si" value="Si" required><label for="consent_si">Sí, acepto participar</label></div><div class="radio-row"><input type="radio" name="consentimiento" id="consent_no" value="No"><label for="consent_no">No, prefiero no participar</label></div></div>` },
        { id: 'basal_sensacion', html: `<div class="step-label">Percepción inicial</div><div class="step-question">En este momento, ¿cómo describiría la sensación en su cuerpo?</div><div class="option-group"><div class="radio-row"><input type="radio" name="basal_sensacion" id="sens_relajado" value="Relajado"><label for="sens_relajado">Relajado, sin tensiones</label></div><div class="radio-row"><input type="radio" name="basal_sensacion" id="sens_inquieto" value="Inquieto"><label for="sens_inquieto">Un poco inquieto</label></div><div class="radio-row"><input type="radio" name="basal_sensacion" id="sens_tension" value="Tension_leve"><label for="sens_tension">Tensión leve (hombros, mandíbula)</label></div><div class="radio-row"><input type="radio" name="basal_sensacion" id="sens_nervioso" value="Nervioso"><label for="sens_nervioso">Nervioso, corazón algo acelerado</label></div><div class="radio-row"><input type="radio" name="basal_sensacion" id="sens_alerta" value="Muy_alerta"><label for="sens_alerta">Muy alerta, como si algo malo pudiera pasar</label></div></div>` },
        { id: 'basal_alerta', html: `<div class="step-label">Nivel de alerta corporal</div><div class="step-question">En una escala de 0 (relajado) a 10 (máxima alerta), ¿cómo se siente usualmente?</div><div style="display:flex; gap:16px; flex-wrap:wrap; margin-top:8px;"><div style="flex:1; min-width:140px;"><label style="font-weight:500;">De día</label><input type="number" name="alerta_dia" min="0" max="10" placeholder="0-10" style="margin-top:6px;"></div><div style="flex:1; min-width:140px;"><label style="font-weight:500;">De noche</label><input type="number" name="alerta_noche" min="0" max="10" placeholder="0-10" style="margin-top:6px;"></div></div>` },
        { id: 'sensorial', html: `<div class="step-label">Sensaciones al caminar de noche</div><div class="step-question">Camine mentalmente por su cuadra de noche. ¿Qué sensación física predomina? (puede marcar varias)</div><div class="option-group"><div class="check-row"><input type="checkbox" name="sensorial_opresion" value="1" id="chk_opresion"><label for="chk_opresion">Opresión en el pecho</label></div><div class="check-row"><input type="checkbox" name="sensorial_mirar_atras" value="1" id="chk_mirar"><label for="chk_mirar">Necesidad de mirar hacia atrás</label></div><div class="check-row"><input type="checkbox" name="sensorial_tension_hombros" value="1" id="chk_hombros"><label for="chk_hombros">Hombros y cuello tensos</label></div><div class="check-row"><input type="checkbox" name="sensorial_caminar_rapido" value="1" id="chk_rapido"><label for="chk_rapido">Ganas de caminar muy rápido</label></div><div class="check-row"><input type="checkbox" name="sensorial_manos_sudorosas" value="1" id="chk_manos"><label for="chk_manos">Manos sudorosas o agarrando fuerte</label></div><div class="check-row"><input type="checkbox" name="sensorial_sentir_observado" value="1" id="chk_observado"><label for="chk_observado">Sensación de que alguien lo observa</label></div><div class="check-row"><input type="checkbox" name="sensorial_ninguna" value="1" id="chk_ninguna"><label for="chk_ninguna">Ninguna, me siento tranquilo/a</label></div></div>` },
        { id: 'olores', html: `<div class="step-label">Asociación sensorial</div><div class="step-question">Piense en olores. ¿Qué olor asocia con SEGURIDAD y cuál con PELIGRO?</div><input type="text" name="olor_seguridad" placeholder="Olor que representa seguridad" style="margin-bottom:12px;"><input type="text" name="olor_peligro" placeholder="Olor que representa peligro">` },
        { id: 'pesadillas', html: `<div class="step-label">Descanso</div><div class="step-question">En el último mes, ¿con qué frecuencia tuvo pesadillas sobre persecuciones, robos o ataques?</div><div class="option-group"><div class="radio-row"><input type="radio" name="pesadillas" id="pes_nunca" value="Nunca"><label for="pes_nunca">Nunca</label></div><div class="radio-row"><input type="radio" name="pesadillas" id="pes_1" value="1_vez"><label for="pes_1">1 vez</label></div><div class="radio-row"><input type="radio" name="pesadillas" id="pes_2_3" value="2_3_veces"><label for="pes_2_3">2-3 veces</label></div><div class="radio-row"><input type="radio" name="pesadillas" id="pes_mas3" value="Mas_3"><label for="pes_mas3">Más de 3 veces</label></div></div>` },
        { id: 'c1_medida_seguridad', html: `<div class="step-label">Propuestas</div><div class="step-question">Para mejorar la seguridad, ¿qué medida considera más efectiva?</div><div class="card-grid"><div class="card-option"><input type="radio" name="c1_medida_seguridad" id="c1_policia" value="Mas_policias"><label for="c1_policia"><span class="card-icon">👮</span> Más policías en calles</label></div><div class="card-option"><input type="radio" name="c1_medida_seguridad" id="c1_escuelas" value="Mejores_escuelas"><label for="c1_escuelas"><span class="card-icon">🏫</span> Mejores escuelas y educación</label></div><div class="card-option"><input type="radio" name="c1_medida_seguridad" id="c1_jueces" value="Jueces_estrictos"><label for="c1_jueces"><span class="card-icon">⚖️</span> Jueces más estrictos</label></div><div class="card-option"><input type="radio" name="c1_medida_seguridad" id="c1_fiscales" value="Fiscales_eficientes"><label for="c1_fiscales"><span class="card-icon">📋</span> Fiscales más eficientes</label></div><div class="card-option"><input type="radio" name="c1_medida_seguridad" id="c1_drogas" value="Combatir_narcotrafico"><label for="c1_drogas"><span class="card-icon">🚫</span> Combatir el narcotráfico</label></div></div>` },
        { id: 'victimizacion', html: `<div class="step-label">Experiencia personal</div><div class="step-question">En los últimos 12 meses, ¿fue víctima de alguno de estos hechos? (marque todos los que correspondan)</div><div class="card-grid" style="grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));"><div class="card-option"><input type="checkbox" name="delitos" id="del_robo" value="Robo"><label for="del_robo"><span class="card-icon">👊</span> Robo con violencia</label></div><div class="card-option"><input type="checkbox" name="delitos" id="del_hurto" value="Hurto"><label for="del_hurto"><span class="card-icon">🎒</span> Hurto (sin violencia)</label></div><div class="card-option"><input type="checkbox" name="delitos" id="del_arrebato" value="Arrebato"><label for="del_arrebato"><span class="card-icon">🏃</span> Arrebato en vía pública</label></div><div class="card-option"><input type="checkbox" name="delitos" id="del_amenazas" value="Amenazas"><label for="del_amenazas"><span class="card-icon">🗣️</span> Amenazas</label></div><div class="card-option"><input type="checkbox" name="delitos" id="del_lesiones" value="Lesiones"><label for="del_lesiones"><span class="card-icon">🤕</span> Lesiones</label></div><div class="card-option"><input type="checkbox" name="delitos" id="del_acoso" value="Acoso"><label for="del_acoso"><span class="card-icon">🚶‍♀️</span> Acoso callejero</label></div><div class="card-option"><input type="checkbox" name="delitos" id="del_roboveh" value="RoboVehiculo"><label for="del_roboveh"><span class="card-icon">🚗</span> Robo de vehículo</label></div><div class="card-option"><input type="checkbox" name="delitos" id="del_hurtoveh" value="HurtoVehiculo"><label for="del_hurtoveh"><span class="card-icon">🔧</span> Hurto de autopartes</label></div><div class="card-option"><input type="checkbox" name="delitos" id="del_roboviv" value="RoboVivienda"><label for="del_roboviv"><span class="card-icon">🏠</span> Robo en vivienda</label></div><div class="card-option"><input type="checkbox" name="delitos" id="del_danio" value="Daño"><label for="del_danio"><span class="card-icon">💥</span> Daño a propiedad</label></div><div class="card-option"><input type="checkbox" name="delitos" id="del_extorsion" value="Extorsion"><label for="del_extorsion"><span class="card-icon">📞</span> Extorsión</label></div><div class="card-option"><input type="checkbox" name="delitos" id="del_violgenero" value="ViolenciaGenero"><label for="del_violgenero"><span class="card-icon">🚺</span> Violencia de género</label></div><div class="card-option"><input type="checkbox" name="delitos" id="del_ninguno" value="Ninguno"><label for="del_ninguno"><span class="card-icon">✅</span> No fui víctima</label></div></div>` },
        { id: 'ultimo_hecho', html: `<div class="step-label">Último evento</div><div class="step-question">Del o los hechos que marcó, ¿cuál fue el ÚLTIMO en el tiempo?</div><input type="text" name="ultimo_hecho" placeholder="Ej: Robo, Hurto, Amenazas...">` },
        { id: 'denuncio', html: `<div class="step-label">Denuncia</div><div class="step-question">Ese último hecho, ¿fue denunciado ante el Ministerio Público Fiscal?</div><div class="option-group"><div class="radio-row"><input type="radio" name="denuncio" id="den_si" value="Si"><label for="den_si">Sí</label></div><div class="radio-row"><input type="radio" name="denuncio" id="den_no" value="No"><label for="den_no">No</label></div><div class="radio-row"><input type="radio" name="denuncio" id="den_nr" value="Prefiero_no_responder"><label for="den_nr">Prefiero no responder</label></div></div>`, conditionalNext: true },
        { id: 'denuncia_si_medio', condition: 'denuncio_si', html: `<div class="step-label">Medio de denuncia</div><div class="step-question">¿A través de qué medio realizó la denuncia?</div><div class="option-group"><div class="radio-row"><input type="radio" name="medio_denuncia" id="med_presencial" value="Presencial"><label for="med_presencial">Presencial en Oficina Fiscal</label></div><div class="radio-row"><input type="radio" name="medio_denuncia" id="med_web" value="Web_MPF"><label for="med_web">Página web del MPF</label></div><div class="radio-row"><input type="radio" name="medio_denuncia" id="med_totem" value="Totem"><label for="med_totem">Tótem / CEDEW</label></div><div class="radio-row"><input type="radio" name="medio_denuncia" id="med_lexa" value="Lexa"><label for="med_lexa">Chatbot LEXA</label></div><div class="radio-row"><input type="radio" name="medio_denuncia" id="med_otro" value="Otro_medio"><label for="med_otro">Otro</label></div></div>` },
        { id: 'denuncia_si_razon', condition: 'denuncio_si', html: `<div class="step-label">Motivo principal</div><div class="step-question">Razón PRINCIPAL para denunciar</div><div class="option-group"><div class="radio-row"><input type="radio" name="razon_denunciar" id="raz_seguro" value="Seguro"><label for="raz_seguro">Necesitaba para seguro / trámite</label></div><div class="radio-row"><input type="radio" name="razon_denunciar" id="raz_justicia" value="Justicia"><label for="raz_justicia">Quería que investiguen / castiguen</label></div><div class="radio-row"><input type="radio" name="razon_denunciar" id="raz_recuperar" value="Recuperar"><label for="raz_recuperar">Para recuperar lo robado</label></div><div class="radio-row"><input type="radio" name="razon_denunciar" id="raz_obligacion" value="Obligacion"><label for="raz_obligacion">Obligación legal/laboral</label></div><div class="radio-row"><input type="radio" name="razon_denunciar" id="raz_recomendacion" value="Recomendacion"><label for="raz_recomendacion">Me lo recomendaron</label></div><div class="radio-row"><input type="radio" name="razon_denunciar" id="raz_otra" value="Otra_razon"><label for="raz_otra">Otra</label></div></div>` },
        { id: 'denuncia_si_maltrato', condition: 'denuncio_si', html: `<div class="step-label">Atención recibida</div><div class="step-question">En el momento de la denuncia, ¿el personal de la Fiscalía realizó alguna de estas acciones? (varias opciones)</div><div class="option-group"><div class="check-row"><input type="checkbox" name="maltrato_pregunta_reiterada" id="mal1" value="1"><label for="mal1">Preguntó repetidamente si estaba seguro/a</label></div><div class="check-row"><input type="checkbox" name="maltrato_exigio_pruebas" id="mal2" value="1"><label for="mal2">Exigió pruebas que yo no tenía</label></div><div class="check-row"><input type="checkbox" name="maltrato_advirtio_represalias" id="mal3" value="1"><label for="mal3">Advirtió sobre posibles represalias</label></div><div class="check-row"><input type="checkbox" name="maltrato_minimizo" id="mal4" value="1"><label for="mal4">Minimizó el hecho ("no es para tanto")</label></div><div class="check-row"><input type="checkbox" name="maltrato_interrupcion" id="mal5" value="1"><label for="mal5">Me interrumpió / mostró desinterés</label></div><div class="check-row"><input type="checkbox" name="maltrato_buena_experiencia" id="mal6" value="1"><label for="mal6">Buena experiencia: trato respetuoso</label></div><div class="check-row"><input type="checkbox" name="maltrato_ninguna" id="mal7" value="1"><label for="mal7">Ninguna de las anteriores</label></div></div>` },
        { id: 'denuncia_no_intento', condition: 'denuncio_no', html: `<div class="step-label">Intento de denuncia</div><div class="step-question">¿Intentó hacer la denuncia en algún momento?</div><div class="option-group"><div class="radio-row"><input type="radio" name="intento_denunciar" id="int_si" value="Si_intento_no_pude"><label for="int_si">Sí, intenté pero no pude completarla</label></div><div class="radio-row"><input type="radio" name="intento_denunciar" id="int_no" value="No_intente"><label for="int_no">No, ni siquiera lo intenté</label></div></div>` },
        { id: 'denuncia_no_obstaculo', condition: 'denuncio_no', html: `<div class="step-label">Obstáculo</div><div class="step-question">(Si intentó) ¿Cuál fue el principal obstáculo?</div><div class="option-group"><div class="radio-row"><input type="radio" name="obstaculo" id="obs_lejos" value="Lejos"><label for="obs_lejos">Oficina Fiscal muy lejos</label></div><div class="radio-row"><input type="radio" name="obstaculo" id="obs_horarios" value="Horarios"><label for="obs_horarios">Horarios de atención no compatibles</label></div><div class="radio-row"><input type="radio" name="obstaculo" id="obs_virtual" value="Fallo_virtual"><label for="obs_virtual">Sistema virtual falló / difícil</label></div><div class="radio-row"><input type="radio" name="obstaculo" id="obs_horas" value="Muchas_horas"><label for="obs_horas">Muchas horas de espera</label></div><div class="radio-row"><input type="radio" name="obstaculo" id="obs_rechazo" value="Rechazaron"><label for="obs_rechazo">Rechazaron la denuncia</label></div><div class="radio-row"><input type="radio" name="obstaculo" id="obs_maltrato" value="Maltrato"><label for="obs_maltrato">Maltrato / no me tomaron en serio</label></div></div>` },
        { id: 'denuncia_no_razon', condition: 'denuncio_no', html: `<div class="step-label">Motivo de no denuncia</div><div class="step-question">(Si no intentó) Razón principal para no intentarlo</div><div class="option-group"><div class="radio-row"><input type="radio" name="razon_no_intento" id="rni_miedo" value="Miedo_represalias"><label for="rni_miedo">Miedo a represalias</label></div><div class="radio-row"><input type="radio" name="razon_no_intento" id="rni_desconf" value="Desconfianza"><label for="rni_desconf">No confío en Fiscalía/Justicia</label></div><div class="radio-row"><input type="radio" name="razon_no_intento" id="rni_menor" value="Hecho_menor"><label for="rni_menor">Hecho menor / pérdida chica</label></div><div class="radio-row"><input type="radio" name="razon_no_intento" id="rni_nosabia" value="No_sabia"><label for="rni_nosabia">No sabía cómo denunciar</label></div><div class="radio-row"><input type="radio" name="razon_no_intento" id="rni_malaref" value="Mala_referencia"><label for="rni_malaref">Conozco alguien con mala experiencia</label></div><div class="radio-row"><input type="radio" name="razon_no_intento" id="rni_resolvi" value="Resolvi_por_mi_cuenta"><label for="rni_resolvi">Lo resolví por mi cuenta</label></div></div>` },
        { id: 'denuncia_no_trato', condition: 'denuncio_no', html: `<div class="step-label">Expectativa de trato</div><div class="step-question">¿Cómo cree que habría sido el trato del personal de la Fiscalía si hubiera denunciado?</div><div class="option-group"><div class="radio-row"><input type="radio" name="trato_esperado" id="trato_bueno" value="Bueno"><label for="trato_bueno">Bueno / respetuoso</label></div><div class="radio-row"><input type="radio" name="trato_esperado" id="trato_regular" value="Regular"><label for="trato_regular">Regular / indiferente</label></div><div class="radio-row"><input type="radio" name="trato_esperado" id="trato_malo" value="Malo"><label for="trato_malo">Malo / revictimizante</label></div><div class="radio-row"><input type="radio" name="trato_esperado" id="trato_nose" value="No_se"><label for="trato_nose">No sé / no puedo opinar</label></div></div>` },

        { id: 'c2_mano_dura', html: `<div class="step-label">Conceptos</div><div class="step-question">Cuando escucha la frase <strong>"mano dura"</strong>, ¿qué emoción le genera principalmente?</div><div class="option-group"><div class="radio-row"><input type="radio" name="c2_consistencia_mano_dura" id="md_esperanza" value="Esperanza"><label for="md_esperanza">Esperanza</label></div><div class="radio-row"><input type="radio" name="c2_consistencia_mano_dura" id="md_miedo" value="Miedo"><label for="md_miedo">Miedo</label></div><div class="radio-row"><input type="radio" name="c2_consistencia_mano_dura" id="md_indiferencia" value="Indiferencia"><label for="md_indiferencia">Indiferencia</label></div><div class="radio-row"><input type="radio" name="c2_consistencia_mano_dura" id="md_desconfianza" value="Desconfianza"><label for="md_desconfianza">Desconfianza</label></div><div class="radio-row"><input type="radio" name="c2_consistencia_mano_dura" id="md_seguridad" value="Seguridad"><label for="md_seguridad">Seguridad</label></div></div>` },
        { id: 'd2_influencia_voto', html: `<div class="step-question">¿En qué medida cree que su <strong>voto influye en sus opiniones</strong> sobre seguridad?</div><div class="option-group"><div class="radio-row"><input type="radio" name="d2_locus_control_voto" id="voto_nada" value="Nada"><label for="voto_nada">Nada</label></div><div class="radio-row"><input type="radio" name="d2_locus_control_voto" id="voto_poco" value="Poco"><label for="voto_poco">Poco</label></div><div class="radio-row"><input type="radio" name="d2_locus_control_voto" id="voto_algo" value="Algo"><label for="voto_algo">Algo</label></div><div class="radio-row"><input type="radio" name="d2_locus_control_voto" id="voto_mucho" value="Mucho"><label for="voto_mucho">Mucho</label></div></div>` },
        { id: 'seguridad_absoluta', html: `<div class="step-label">Para finalizar</div><div class="step-question">Describa un lugar, olor, sonido o sensación que le transmita <strong>calma y seguridad absoluta</strong></div><textarea name="seguridad_absoluta" rows="2" placeholder="Ej: El sonido de la lluvia, olor a pan casero..."></textarea>` }
      ];

      let currentStepIndex = 0;
      const form = document.getElementById('mainForm');
      const stepContainer = document.getElementById('stepContainer');
      const progressFill = document.getElementById('progressFill');

      function buildFlatSequence() { return steps.map(step => ({ ...step, _conditional: step.condition ? true : false })); }
      const flatSequence = buildFlatSequence();
      let activeSequence = [];

      function isNingunoSelected() { const checks = document.querySelectorAll('input[name="delitos"]:checked'); for (let c of checks) { if (c.value === 'Ninguno') return true; } return false; }
      function getRadioValue(name) { const el = document.querySelector(`input[name="${name}"]:checked`); return el ? el.value : null; }

      function resolveActiveSequence() {
        const denuncioValue = getRadioValue('denuncio');
        const ninguno = isNingunoSelected();
        activeSequence = [];
        for (let step of flatSequence) {
          if (ninguno && ['ultimo_hecho', 'denuncio'].includes(step.id)) continue;
          if (step._conditional) {
            if (step.condition === 'denuncio_si' && denuncioValue === 'Si') activeSequence.push(step);
            else if (step.condition === 'denuncio_no' && denuncioValue === 'No') activeSequence.push(step);
          } else { activeSequence.push(step); }
        }
      }

      function renderStep(index) {
        if (index >= activeSequence.length) {
          stepContainer.innerHTML = `<div class="step active"><div class="step-question" style="text-align:center;">Gracias por completar la encuesta.</div><button id="submitBtn" type="button">Enviar respuestas</button><div id="formStatus"></div></div>`;
          document.getElementById('submitBtn').addEventListener('click', () => {
            document.getElementById('formStatus').innerHTML = '<div class="message success">Enviando...</div>';
            form.submit();
            setTimeout(() => {
              document.getElementById('formStatus').innerHTML = '<div class="message success">✅ Respuestas enviadas. ¡Muchas gracias!</div>';
              document.getElementById('submitBtn').disabled = true;
            }, 1000);
          });
          progressFill.style.width = '100%'; return;
        }
        const stepData = activeSequence[index];
        stepContainer.innerHTML = `<div class="step active">${stepData.html}<div class="nav-buttons">${index > 0 ? '<button class="secondary" id="prevBtn">Anterior</button>' : ''}<button id="nextBtn">${index === activeSequence.length - 1 ? 'Finalizar' : 'Siguiente'}</button></div></div>`;
        document.getElementById('nextBtn').addEventListener('click', () => {
          if (stepData.id === 'consent' && (!document.querySelector('input[name="consentimiento"]:checked') || document.querySelector('input[name="consentimiento"]:checked').value !== 'Si')) { alert('Debe aceptar participar para continuar.'); return; }
          if (stepData.id === 'victimizacion' || stepData.id === 'denuncio') { resolveActiveSequence(); const newIndex = activeSequence.findIndex(s => s.id === stepData.id); if (newIndex !== -1) currentStepIndex = newIndex; }
          currentStepIndex++;
          if (stepData.id === 'confianza_policia_municipal') { const slider = document.getElementById('slider_municipal'); const hidden = document.getElementById('hidden_municipal'); if (slider && hidden) hidden.value = slider.value; }
          renderStep(currentStepIndex); updateProgress();
        });
        if (index > 0) { document.getElementById('prevBtn').addEventListener('click', () => { currentStepIndex--; renderStep(currentStepIndex); updateProgress(); }); }
        updateProgress();
      }

      function updateProgress() { const total = activeSequence.length || 1; progressFill.style.width = Math.round((currentStepIndex / total) * 100) + '%'; }
      resolveActiveSequence(); renderStep(0);
      form.addEventListener('change', (e) => { if (e.target.name === 'delitos' || e.target.name === 'denuncio') { resolveActiveSequence(); } });
    })();
  </script>
</body>
</html>
