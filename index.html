<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=1.0, shrink-to-fit=yes">
  <title>Encuesta Victimológica y de Seguridad Ciudadana · Mendoza</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: #eef2f6; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 20px 12px 40px; color: #1e293b; }
    .survey-container { width: 100%; max-width: 600px; background: #ffffff; border-radius: 28px; box-shadow: 0 12px 30px rgba(0,0,0,0.08); overflow: hidden; }
    .survey-header { padding: 24px 24px 12px; text-align: center; border-bottom: 1px solid #e9edf2; }
    .survey-header h1 { font-size: 1.7rem; font-weight: 700; color: #0f3b5c; }
    .survey-header .subtitle { font-size: 0.9rem; color: #5e6f82; margin-top: 6px; font-weight: 500; }
    .progress-bar { height: 4px; background: #e2e8f0; width: 100%; }
    .progress-fill { height: 100%; background: #1e5a7b; width: 0%; transition: width 0.3s; }
    .step-container { padding: 24px 24px 32px; min-height: 360px; }
    .step { display: none; flex-direction: column; gap: 20px; animation: fadeSlide 0.3s ease; }
    .step.active { display: flex; }
    @keyframes fadeSlide { 0% { opacity: 0; transform: translateY(8px); } 100% { opacity: 1; transform: translateY(0); } }
    .step-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.6px; color: #64748b; font-weight: 600; margin-bottom: 4px; }
    .step-question { font-size: 1.2rem; font-weight: 600; color: #0f2b40; line-height: 1.4; margin-bottom: 8px; }
    .option-group { display: flex; flex-direction: column; gap: 12px; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .card-option { position: relative; }
    .card-option input { position: absolute; opacity: 0; pointer-events: none; }
    .card-option label { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 16px 8px; background: #f8fafd; border: 2px solid #e2e8f0; border-radius: 20px; text-align: center; font-weight: 500; color: #334155; cursor: pointer; transition: all 0.2s; min-height: 90px; font-size: 0.9rem; user-select: none; }
    .card-option input:checked+label { border-color: #1e5a7b; background: #e5f0f8; color: #0a3144; box-shadow: 0 4px 12px rgba(30,90,123,0.15); font-weight: 600; }
    .card-icon { font-size: 1.8rem; opacity: 0.8; }
    .slider-group { display: flex; flex-direction: column; gap: 8px; }
    .slider-labels { display: flex; justify-content: space-between; font-size: 0.85rem; color: #475569; font-weight: 500; }
    input[type="range"] { -webkit-appearance: none; width: 100%; height: 8px; background: #dce3eb; border-radius: 10px; outline: none; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; background: #1e5a7b; border-radius: 50%; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.2); border: 2px solid white; }
    .slider-value { text-align: center; font-weight: 700; color: #1e5a7b; font-size: 1rem; }
    .radio-row, .check-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 16px; cursor: pointer; transition: 0.15s; }
    .radio-row:hover, .check-row:hover { background: #edf2f7; }
    .radio-row input, .check-row input { width: 20px; height: 20px; accent-color: #1e5a7b; flex-shrink: 0; }
    .radio-row label, .check-row label { cursor: pointer; flex: 1; font-weight: 500; }
    .nav-buttons { display: flex; justify-content: space-between; margin-top: 24px; gap: 12px; }
    button { background: #1e5a7b; color: white; border: none; border-radius: 40px; padding: 14px 28px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: background 0.2s; flex: 1; min-width: 120px; }
    button.secondary { background: #eef2f6; color: #1e3b4f; border: 1px solid #d0d8e0; }
    button:hover { background: #134357; }
    button.secondary:hover { background: #dfe5ec; }
    button:active { transform: scale(0.97); }
    button:disabled { background: #b0c0cf; cursor: not-allowed; }
    .message { margin-top: 16px; padding: 12px 16px; border-radius: 18px; font-weight: 500; font-size: 0.9rem; }
    .message.success { background: #d9f2e6; color: #0b4635; }
    .message.error { background: #fee9e9; color: #991b1b; }
    textarea, input[type="text"], input[type="number"], select { border: 1px solid #d0d8e0; border-radius: 16px; padding: 12px 16px; font-size: 1rem; font-family: inherit; width: 100%; background: #fafbfc; }
    textarea:focus, input:focus, select:focus { border-color: #1e5a7b; outline: none; box-shadow: 0 0 0 3px rgba(30,90,123,0.1); }
    @media (max-width: 480px) { .step-question { font-size: 1.1rem; } .card-grid { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <div class="survey-container" id="surveyContainer">
    <div class="survey-header">
      <h1>Encuesta de Seguridad Ciudadana</h1>
      <div class="subtitle">Mendoza · Respuestas anónimas</div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <form id="mainForm" novalidate>
      <div class="step-container" id="stepContainer"></div>
    </form>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzFsn9IN84YjhZYrBxNbJ06e_fhXbBJJoH-l7-raN-xsuzJLiohXWmqbZ_P32c7jJoH/exec';
    
    (function() {
      const steps = [
        { id: 'consent', html: `<div class="step-label">Confidencialidad</div><div class="step-question">¿Acepta participar voluntariamente en esta encuesta anónima?</div><div class="option-group"><div class="radio-row"><input type="radio" name="consentimiento" id="consent_si" value="Si" required><label for="consent_si">Sí, acepto participar</label></div><div class="radio-row"><input type="radio" name="consentimiento" id="consent_no" value="No"><label for="consent_no">No, prefiero no participar</label></div></div>` },
        { id: 'basal_sensacion', html: `<div class="step-label">Percepción inicial</div><div class="step-question">En este momento, ¿cómo describiría la sensación en su cuerpo?</div><div class="option-group"><div class="radio-row"><input type="radio" name="basal_sensacion" id="sens_relajado" value="Relajado"><label for="sens_relajado">Relajado, sin tensiones</label></div><div class="radio-row"><input type="radio" name="basal_sensacion" id="sens_inquieto" value="Inquieto"><label for="sens_inquieto">Un poco inquieto</label></div><div class="radio-row"><input type="radio" name="basal_sensacion" id="sens_tension" value="Tension_leve"><label for="sens_tension">Tensión leve (hombros, mandíbula)</label></div><div class="radio-row"><input type="radio" name="basal_sensacion" id="sens_nervioso" value="Nervioso"><label for="sens_nervioso">Nervioso, corazón algo acelerado</label></div><div class="radio-row"><input type="radio" name="basal_sensacion" id="sens_alerta" value="Muy_alerta"><label for="sens_alerta">Muy alerta, como si algo malo pudiera pasar</label></div></div>` },
        { id: 'basal_alerta', html: `<div class="step-label">Nivel de alerta corporal</div><div class="step-question">En una escala de 0 (relajado) a 10 (máxima alerta), ¿cómo se siente usualmente?</div><div style="display:flex; gap:16px; flex-wrap:wrap; margin-top:8px;"><div style="flex:1; min-width:140px;"><label style="font-weight:500;">De día</label><input type="number" name="alerta_dia" min="0" max="10" placeholder="0-10" style="margin-top:6px;"></div><div style="flex:1; min-width:140px;"><label style="font-weight:500;">De noche</label><input type="number" name="alerta_noche" min="0" max="10" placeholder="0-10" style="margin-top:6px;"></div></div>` },
        { id: 'sensorial', html: `<div class="step-label">Sensaciones al caminar de noche</div><div class="step-question">Camine mentalmente por su cuadra de noche. ¿Qué sensación física predomina? (puede marcar varias)</div><div class="option-group"><div class="check-row"><input type="checkbox" name="sensorial_opresion" value="1"><label>Opresión en el pecho</label></div><div class="check-row"><input type="checkbox" name="sensorial_mirar_atras" value="1"><label>Necesidad de mirar hacia atrás</label></div><div class="check-row"><input type="checkbox" name="sensorial_tension_hombros" value="1"><label>Hombros y cuello tensos</label></div><div class="check-row"><input type="checkbox" name="sensorial_caminar_rapido" value="1"><label>Ganas de caminar muy rápido</label></div><div class="check-row"><input type="checkbox" name="sensorial_manos_sudorosas" value="1"><label>Manos sudorosas o agarrando fuerte</label></div><div class="check-row"><input type="checkbox" name="sensorial_sentir_observado" value="1"><label>Sensación de que alguien lo observa</label></div><div class="check-row"><input type="checkbox" name="sensorial_ninguna" value="1"><label>Ninguna, me siento tranquilo/a</label></div></div>` },
        { id: 'olores', html: `<div class="step-label">Asociación sensorial</div><div class="step-question">Piense en olores. ¿Qué olor asocia con SEGURIDAD y cuál con PELIGRO?</div><input type="text" name="olor_seguridad" placeholder="Olor que representa seguridad" style="margin-bottom:12px;"><input type="text" name="olor_peligro" placeholder="Olor que representa peligro">` },
        { id: 'pesadillas', html: `<div class="step-label">Descanso</div><div class="step-question">En el último mes, ¿con qué frecuencia tuvo pesadillas sobre persecuciones, robos o ataques?</div><div class="option-group"><div class="radio-row"><input type="radio" name="pesadillas" value="Nunca"><label>Nunca</label></div><div class="radio-row"><input type="radio" name="pesadillas" value="1_vez"><label>1 vez</label></div><div class="radio-row"><input type="radio" name="pesadillas" value="2_3_veces"><label>2-3 veces</label></div><div class="radio-row"><input type="radio" name="pesadillas" value="Mas_3"><label>Más de 3 veces</label></div></div>` },
        { id: 'c1_medida_seguridad', html: `<div class="step-label">Propuestas</div><div class="step-question">Para mejorar la seguridad, ¿qué medida considera más efectiva?</div><div class="card-grid"><div class="card-option"><input type="radio" name="c1_medida_seguridad" value="Mas_policias"><label><span class="card-icon">👮</span> Más policías en calles</label></div><div class="card-option"><input type="radio" name="c1_medida_seguridad" value="Mejores_escuelas"><label><span class="card-icon">🏫</span> Mejores escuelas y educación</label></div><div class="card-option"><input type="radio" name="c1_medida_seguridad" value="Jueces_estrictos"><label><span class="card-icon">⚖️</span> Jueces más estrictos</label></div><div class="card-option"><input type="radio" name="c1_medida_seguridad" value="Fiscales_eficientes"><label><span class="card-icon">📋</span> Fiscales más eficientes</label></div><div class="card-option"><input type="radio" name="c1_medida_seguridad" value="Combatir_narcotrafico"><label><span class="card-icon">🚫</span> Combatir el narcotráfico</label></div></div>` },
        { id: 'victimizacion', html: `<div class="step-label">Experiencia personal</div><div class="step-question">En los últimos 12 meses, ¿fue víctima de alguno de estos hechos? (marque todos los que correspondan)</div><div class="card-grid" style="grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));"><div class="card-option"><input type="checkbox" name="delitos" value="Robo"><label><span class="card-icon">👊</span> Robo con violencia</label></div><div class="card-option"><input type="checkbox" name="delitos" value="Hurto"><label><span class="card-icon">🎒</span> Hurto (sin violencia)</label></div><div class="card-option"><input type="checkbox" name="delitos" value="Arrebato"><label><span class="card-icon">🏃</span> Arrebato en vía pública</label></div><div class="card-option"><input type="checkbox" name="delitos" value="Amenazas"><label><span class="card-icon">🗣️</span> Amenazas</label></div><div class="card-option"><input type="checkbox" name="delitos" value="Lesiones"><label><span class="card-icon">🤕</span> Lesiones</label></div><div class="card-option"><input type="checkbox" name="delitos" value="Acoso"><label><span class="card-icon">🚶‍♀️</span> Acoso callejero</label></div><div class="card-option"><input type="checkbox" name="delitos" value="RoboVehiculo"><label><span class="card-icon">🚗</span> Robo de vehículo</label></div><div class="card-option"><input type="checkbox" name="delitos" value="HurtoVehiculo"><label><span class="card-icon">🔧</span> Hurto de autopartes</label></div><div class="card-option"><input type="checkbox" name="delitos" value="RoboVivienda"><label><span class="card-icon">🏠</span> Robo en vivienda</label></div><div class="card-option"><input type="checkbox" name="delitos" value="Daño"><label><span class="card-icon">💥</span> Daño a propiedad</label></div><div class="card-option"><input type="checkbox" name="delitos" value="Extorsion"><label><span class="card-icon">📞</span> Extorsión</label></div><div class="card-option"><input type="checkbox" name="delitos" value="ViolenciaGenero"><label><span class="card-icon">🚺</span> Violencia de género</label></div><div class="card-option"><input type="checkbox" name="delitos" value="Ninguno"><label><span class="card-icon">✅</span> No fui víctima</label></div></div>` },
        { id: 'ultimo_hecho', html: `<div class="step-label">Último evento</div><div class="step-question">Del o los hechos que marcó, ¿cuál fue el ÚLTIMO en el tiempo?</div><input type="text" name="ultimo_hecho" placeholder="Ej: Robo, Hurto, Amenazas...">` },
        { id: 'denuncio', html: `<div class="step-label">Denuncia</div><div class="step-question">Ese último hecho, ¿fue denunciado ante el Ministerio Público Fiscal?</div><div class="option-group"><div class="radio-row"><input type="radio" name="denuncio" value="Si"><label>Sí</label></div><div class="radio-row"><input type="radio" name="denuncio" value="No"><label>No</label></div><div class="radio-row"><input type="radio" name="denuncio" value="Prefiero_no_responder"><label>Prefiero no responder</label></div></div>`, conditionalNext: true },
        { id: 'denuncia_si_medio', condition: 'denuncio_si', html: `<div class="step-label">Medio de denuncia</div><div class="step-question">¿A través de qué medio realizó la denuncia?</div><div class="option-group"><div class="radio-row"><input type="radio" name="medio_denuncia" value="Presencial"><label>Presencial en Oficina Fiscal</label></div><div class="radio-row"><input type="radio" name="medio_denuncia" value="Web_MPF"><label>Página web del MPF</label></div><div class="radio-row"><input type="radio" name="medio_denuncia" value="Totem"><label>Tótem / CEDEW</label></div><div class="radio-row"><input type="radio" name="medio_denuncia" value="Lexa"><label>Chatbot LEXA</label></div><div class="radio-row"><input type="radio" name="medio_denuncia" value="Otro_medio"><label>Otro</label></div></div>` },
        { id: 'denuncia_si_razon', condition: 'denuncio_si', html: `<div class="step-label">Motivo principal</div><div class="step-question">Razón PRINCIPAL para denunciar</div><div class="option-group"><div class="radio-row"><input type="radio" name="razon_denunciar" value="Seguro"><label>Necesitaba para seguro / trámite</label></div><div class="radio-row"><input type="radio" name="razon_denunciar" value="Justicia"><label>Quería que investiguen / castiguen</label></div><div class="radio-row"><input type="radio" name="razon_denunciar" value="Recuperar"><label>Para recuperar lo robado</label></div><div class="radio-row"><input type="radio" name="razon_denunciar" value="Obligacion"><label>Obligación legal/laboral</label></div><div class="radio-row"><input type="radio" name="razon_denunciar" value="Recomendacion"><label>Me lo recomendaron</label></div><div class="radio-row"><input type="radio" name="razon_denunciar" value="Otra_razon"><label>Otra</label></div></div>` },
        { id: 'fin', html: `<div class="step-question" style="text-align:center;">Gracias por completar la encuesta.</div><button id="submitBtn" type="button">Enviar respuestas</button><div id="formStatus"></div>` }
      ];

      let currentStepIndex = 0;
      const form = document.getElementById('mainForm');
      const stepContainer = document.getElementById('stepContainer');
      const progressFill = document.getElementById('progressFill');
      let activeSequence = [];

      function buildFlatSequence() { return steps.map(step => ({ ...step, _conditional: step.condition ? true : false })); }
      const flatSequence = buildFlatSequence();

      function getRadioValue(name) { const el = document.querySelector(`input[name="${name}"]:checked`); return el ? el.value : null; }

      function resolveActiveSequence() {
        const denuncioValue = getRadioValue('denuncio');
        activeSequence = [];
        for (let step of flatSequence) {
          if (step._conditional) {
            if (step.condition === 'denuncio_si' && denuncioValue === 'Si') activeSequence.push(step);
            else if (step.condition === 'denuncio_no' && denuncioValue === 'No') activeSequence.push(step);
          } else { activeSequence.push(step); }
        }
      }

      function renderStep(index) {
        if (index >= activeSequence.length) {
          stepContainer.innerHTML = `<div class="step active"><div class="step-question" style="text-align:center;">Gracias.</div></div>`;
          progressFill.style.width = '100%';
          return;
        }
        const stepData = activeSequence[index];
        stepContainer.innerHTML = `<div class="step active">${stepData.html}<div class="nav-buttons">${index > 0 ? '<button class="secondary" id="prevBtn">Anterior</button>' : ''}<button id="nextBtn">${index === activeSequence.length - 1 ? 'Finalizar' : 'Siguiente'}</button></div></div>`;

        if (stepData.id === 'fin') {
          document.getElementById('submitBtn').addEventListener('click', () => {
            const statusDiv = document.getElementById('formStatus');
            statusDiv.innerHTML = '<div class="message success">Enviando...</div>';
            
            // Construir body EXACTAMENTE como prueba.html
            const params = [];
            const elements = form.querySelectorAll('input[name], select[name], textarea[name]');
            elements.forEach(el => {
              if (el.name) {
                if ((el.type === 'radio' || el.type === 'checkbox') && !el.checked) return;
                params.push(encodeURIComponent(el.name) + '=' + encodeURIComponent(el.value));
              }
            });
            const body = params.join('&');
            
            fetch(SCRIPT_URL, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body: body
            }).then(() => {
              statusDiv.innerHTML = '<div class="message success">✅ Respuestas enviadas. ¡Muchas gracias!</div>';
              document.getElementById('submitBtn').disabled = true;
            }).catch(err => {
              statusDiv.innerHTML = '<div class="message error">❌ Error al enviar.</div>';
            });
          });
          progressFill.style.width = '100%';
          return;
        }

        document.getElementById('nextBtn').addEventListener('click', () => {
          if (stepData.id === 'consent' && getRadioValue('consentimiento') !== 'Si') { alert('Debe aceptar participar para continuar.'); return; }
          if (stepData.id === 'denuncio') { resolveActiveSequence(); const newIndex = activeSequence.findIndex(s => s.id === 'denuncio'); if (newIndex !== -1) currentStepIndex = newIndex; }
          currentStepIndex++;
          renderStep(currentStepIndex);
          updateProgress();
        });
        if (index > 0) {
          document.getElementById('prevBtn').addEventListener('click', () => { currentStepIndex--; renderStep(currentStepIndex); updateProgress(); });
        }
        updateProgress();
      }

      function updateProgress() { const total = activeSequence.length || 1; progressFill.style.width = Math.round((currentStepIndex / total) * 100) + '%'; }
      resolveActiveSequence(); renderStep(0);
    })();
  </script>
</body>
</html>
